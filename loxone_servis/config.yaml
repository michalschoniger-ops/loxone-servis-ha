name: Evora Smart Hub
version: "2.2.3"
slug: loxone_fleet
description: Bezpečný servisní a monitorovací hub pro Loxone a Home Assistant.
url: https://github.com/michalschoniger-ops/loxone-servis
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_title: Evora Smart Hub
panel_icon: mdi:home-automation
panel_admin: false
watchdog: http://[HOST]:[PORT:8099]/healthz
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Přímý web Evora Smart Hubu (pro HTTPS reverse proxy nebo Tailscale Funnel)
options:
  credentials_master_key: ""
  bootstrap_admin_email: schoniger@evorasmart.cz
  bootstrap_admin_display_name: Bc. Michal Schöniger
  bootstrap_admin_password_hash: ""
  cron_secret: ""
  local_setup_allowed: false
schema:
  credentials_master_key: password
  bootstrap_admin_email: str
  bootstrap_admin_display_name: str
  bootstrap_admin_password_hash: password
  cron_secret: password
  local_setup_allowed: bool
  ha_notify_service: str?
  public_base_url: url?
  canonical_base_url: url?
  backup_encryption_key: password?
  backup_pull_token: password?
